name: Alia PR Analysis

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Alia Action
        uses: ./
        # Self-analysis depends on the external Alia backend serving the skill
        # bundle; don't block PRs when the backend can't (e.g. 404 skill zip).
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALIA_BACKEND_URL: ${{ secrets.ALIA_BACKEND_URL }}
          ALIA_SKILL_STORE_ROUTE: ${{ secrets.ALIA_SKILL_STORE_ROUTE }}
          ALIA_SAVE_INSIGHTS_ROUTE: ${{ secrets.ALIA_SAVE_INSIGHTS_ROUTE }}
