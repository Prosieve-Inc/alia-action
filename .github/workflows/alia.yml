name: Alia PR Analysis

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue)
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Test actual access
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://global-aiplatform.googleapis.com/v1/projects/REDACTED/locations/global/publishers/anthropic/models/claude-haiku-4-5@20251001:streamRawPredict" \
            -d '{"anthropic_version":"vertex-2023-10-16","messages":[{"role":"user","content":"hi"}],"max_tokens":5}'

      - name: Run Alia Action
        uses: ./
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
