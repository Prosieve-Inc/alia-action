name: "Alia Action"
description: "AI-powered PR analysis -- code never leaves your runner"
branding:
  icon: "eye"
  color: "blue"

runs:
  using: "composite"
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.6"

    - name: Install Dependencies
      shell: bash
      run: |
        cd $GITHUB_ACTION_PATH
        bun install --production

    - name: Run Alia Action
      shell: bash
      run: bun run $GITHUB_ACTION_PATH/src/main.ts
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CLAUDE_CODE_USE_VERTEX: "1"
