name: "Alia Action"
description: "AI-powered PR analysis -- code never leaves your runner"
branding:
  icon: "eye"
  color: "blue"

inputs:
  backend_url:
    description: "Backend API base URL"
    required: true
  auth_route:
    description: "Backend auth endpoint path"
    required: true
  insights_route:
    description: "Backend insights submission endpoint path"
    required: true
  alia_key:
    description: "Decryption key for Vertex AI credentials"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.6"

    - name: Install Dependencies
      shell: bash
      run: |
        cd $GITHUB_ACTION_PATH
        bun install --production

    - name: Run Alia Action
      shell: bash
      run: bun run $GITHUB_ACTION_PATH/src/main.ts
      env:
        INPUT_BACKEND_URL: ${{ inputs.backend_url }}
        INPUT_AUTH_ROUTE: ${{ inputs.auth_route }}
        INPUT_INSIGHTS_ROUTE: ${{ inputs.insights_route }}
        INPUT_ALIA_KEY: ${{ inputs.alia_key }}
        GITHUB_TOKEN: ${{ github.token }}
