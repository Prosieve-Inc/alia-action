name: "Alia Action"
description: "AI-powered PR analysis -- code never leaves your runner"
branding:
  icon: "eye"
  color: "blue"

runs:
  using: "composite"
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.6"

    - name: Install Dependencies
      shell: bash
      run: |
        cd $GITHUB_ACTION_PATH
        bun install --production

    - name: Fetch git history
      shell: bash
      run: |
        EVENT="${{ github.event_name }}"
        WORKSPACE="${{ github.workspace }}"
        if [ "$EVENT" = "workflow_dispatch" ]; then
          echo "Manual trigger — fetching full history"
          git -C "$WORKSPACE" fetch --unshallow || true
        elif [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
          echo "PR trigger — fetching base branch and PR commits"
          git -C "$WORKSPACE" fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true
          COMMITS=${{ github.event.pull_request.commits }}
          git -C "$WORKSPACE" fetch --deepen=$(( COMMITS + 1 )) || true
        elif [ "$EVENT" = "push" ]; then
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch push — keeping shallow clone"
          else
            COMMIT_COUNT=$(jq '.commits | length' "$GITHUB_EVENT_PATH")
            echo "Push trigger — fetching $COMMIT_COUNT commit(s)"
            git -C "$WORKSPACE" fetch --deepen=$(( COMMIT_COUNT + 2 )) || true
          fi
        else
          echo "Event ($EVENT) — fetching recent history"
          git -C "$WORKSPACE" fetch --deepen=20 || true
        fi

    - name: Install RTK CLI
      shell: bash
      env:
        # Pinned for supply-chain safety. Bump SHA + HASH + RTK_VERSION together.
        # SHA: rtk-ai/rtk commit pinning install.sh contents.
        # HASH: sha256 of install.sh at that SHA (verified before exec).
        # RTK_VERSION: pins the rtk binary release the script downloads.
        RTK_INSTALL_SHA: "2fbc7514f6964acabcfac65501b8bb6b525e3aa8"
        RTK_INSTALL_HASH: "0c46611d70d0eee64c43c6398f8b1fe057b7f0b052810bbeec09288898ba9a46"
        RTK_VERSION: "v0.39.0"
      run: |
        curl -fsSL "https://raw.githubusercontent.com/rtk-ai/rtk/${RTK_INSTALL_SHA}/install.sh" -o /tmp/rtk-install.sh
        echo "${RTK_INSTALL_HASH}  /tmp/rtk-install.sh" | sha256sum -c -
        sh /tmp/rtk-install.sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Initialize RTK for Claude Code
      shell: bash
      run: |
        mkdir -p "$HOME/.claude"
        rtk init -g

    - name: Run Alia Action
      shell: bash
      run: bun run $GITHUB_ACTION_PATH/src/main.ts
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CLAUDE_CODE_USE_VERTEX: "1"
        GITHUB_WORKSPACE: ${{ github.workspace }}
        ALIA_BACKEND_URL: ${{ env.ALIA_BACKEND_URL }}
        ALIA_SKILL_STORE_ROUTE: ${{ env.ALIA_SKILL_STORE_ROUTE }}
        ALIA_SAVE_INSIGHTS_ROUTE: ${{ env.ALIA_SAVE_INSIGHTS_ROUTE }}
