name: "Alia Action"
description: "AI-powered PR analysis -- code never leaves your runner"
branding:
  icon: "eye"
  color: "blue"

inputs:
  project_id:
    description: "Google Cloud project ID for Vertex AI"
    required: true
  region:
    description: "Google Cloud region for Vertex AI"
    required: true
    default: "us-east5"

runs:
  using: "composite"
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.6"

    - name: Install Dependencies
      shell: bash
      run: |
        cd $GITHUB_ACTION_PATH
        bun install --production

    - name: Run Alia Action
      shell: bash
      run: bun run $GITHUB_ACTION_PATH/src/main.ts
      env:
        INPUT_PROJECT_ID: ${{ inputs.project_id }}
        INPUT_REGION: ${{ inputs.region }}
        GITHUB_TOKEN: ${{ github.token }}
        CLAUDE_CODE_USE_VERTEX: "1"
        ANTHROPIC_VERTEX_PROJECT_ID: ${{ inputs.project_id }}
        CLOUD_ML_REGION: ${{ inputs.region }}
